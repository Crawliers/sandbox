<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste</title>
</head>
<body>
    <h2>Handleliste</h2>
    <ul> <!--Dette er en uorganisert liste-->
        <li>Kjøttdeig</li>
        <li>Taco-skjell</li>
        <li>Tortillas</li>
        <li>Grønnsaker
            <ul><!--Lister inne i lister gir en indent og lager nye punkter-->
                <li>Salat</li>
                <li>Agurk</li>
                <li>Tomat</li>
                <li>Mais</li>
                <li>Avokado</li>
            </ul>
        </li>
        <li>Ost</li>
        <li>Rømme</li>
        <li>Salsa</li>
    </ul>

    <h2>Fremgangsmåte</h2>
    <ol> <!--Dette er en organisert liste-->
        <li>Stek kjøttdeig</li>
        <li>Kutt grønnsaker</li>
        <li>Varme skjell og tortillas</li>
        <li>Lag guacamole</li>
        <li>Server</li>
        <li>Nyt</li>
    </ol>
</body>
</html>
