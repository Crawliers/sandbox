<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabell</title>
</head>
<body>
    <h2>Handlevogn</h2>
    <table>
        <tr> <!--Her lager vi overskriftene i tabellen, horisontale rader-->
            <th>Produkt</th>
            <th>Pris</th>
            <th>Antall</th>
        </tr>

        <tr> <!--Her fyller vi ut cellene-->
            <td>Playstation 5 Pro</td>
            <td>699,-</td>
            <td>2</td>
        </tr>
        <tr> <!--Denne tabellen gir en ekstra rad vertikalt-->
            <td>Call of Duty: Black Ops 6</td>
            <td>899,-</td>
            <td>1</td>
        </tr>
    </table>
</body>
</html>
